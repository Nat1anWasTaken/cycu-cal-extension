name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the release notes can list commits since the last release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # clangd.wasm (~127 MB) is not committed; cache it by the pinned hashes in fetch-vendor.mjs.
      - uses: actions/cache@v4
        with:
          path: vendor/clangd
          key: vendor-${{ hashFiles('scripts/fetch-vendor.mjs') }}

      # Model weights for the offline builds (~400 MB + ~990 MB), pinned in src/shared/protocol.ts.
      - uses: actions/cache@v4
        with:
          path: vendor/models
          key: models-${{ hashFiles('src/shared/protocol.ts') }}

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm package

      - run: pnpm package:offline-0.5b
        env:
          OUT_DIR: dist-offline-0.5b

      - run: pnpm package:offline-1.5b
        env:
          OUT_DIR: dist-offline-1.5b

      - uses: actions/upload-artifact@v4
        with:
          name: cycu-cal-extension
          # Uploading the directory (not the zip) makes the downloaded artifact a single zip
          # that unpacks straight into a "Load unpacked"-ready folder.
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cycu-cal-extension-offline-0.5b
          path: dist-offline-0.5b/
          if-no-files-found: error
          # The weights are already compressed; skip re-compressing them.
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: cycu-cal-extension-offline-1.5b
          path: dist-offline-1.5b/
          if-no-files-found: error
          compression-level: 0

      # Every push to main becomes a release tagged "<UTC date>-<short sha>", e.g. 2026-10-16-0754622.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, skipping"
            exit 0
          fi
          prev="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$prev" ] && git rev-parse -q --verify "$prev^{commit}" >/dev/null; then
            range="$prev..$GITHUB_SHA"
            echo "## Commits since $prev" > notes.md
          else
            range="$GITHUB_SHA"
            echo "## Commits" > notes.md
          fi
          echo >> notes.md
          git log --no-merges --format="- %h %s" "$range" >> notes.md
          if [ -n "$prev" ]; then
            printf '\n**Full diff**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$tag" >> notes.md
          fi
          gh release create "$tag" release/*.zip --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
