name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # clangd.wasm (~127 MB) is not committed; cache it by the pinned hashes in fetch-vendor.mjs.
      - uses: actions/cache@v4
        with:
          path: vendor/clangd
          key: vendor-${{ hashFiles('scripts/fetch-vendor.mjs') }}

      # Model weights for the offline build (~400 MB), pinned in src/shared/protocol.ts.
      - uses: actions/cache@v4
        with:
          path: vendor/models
          key: models-${{ hashFiles('src/shared/protocol.ts') }}

      - run: pnpm typecheck

      - run: pnpm package

      - run: pnpm package:offline
        env:
          OUT_DIR: dist-offline

      - uses: actions/upload-artifact@v4
        with:
          name: cycu-cal-extension
          # Uploading the directory (not the zip) makes the downloaded artifact a single zip
          # that unpacks straight into a "Load unpacked"-ready folder.
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cycu-cal-extension-offline
          path: dist-offline/
          if-no-files-found: error
          # The weights are already compressed; skip re-compressing ~400 MB.
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --title "$GITHUB_REF_NAME"
