<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.title"></title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <header class="masthead">
        <div class="logo" aria-hidden="true">{ }</div>
        <div>
          <h1 data-i18n="extName"></h1>
          <p class="tagline"><span data-i18n="options.tagline"></span> <span id="version"></span></p>
        </div>
      </header>

      <form id="form" autocomplete="off">
        <h2 data-i18n="options.editor"></h2>
        <section class="card">
          <div class="row">
            <span class="text">
              <span class="title" data-i18n="options.language"></span>
              <span class="desc" data-i18n="options.languageDesc"></span>
            </span>
            <span class="segmented" role="radiogroup" data-i18n-aria-label="options.language">
              <input type="radio" name="language" id="language-auto" value="auto" /><label
                for="language-auto"
                data-i18n="options.languageAuto"
              ></label>
              <input type="radio" name="language" id="language-en" value="en" /><label for="language-en" lang="en"
                >English</label
              >
              <input type="radio" name="language" id="language-zh-TW" value="zh-TW" /><label
                for="language-zh-TW"
                lang="zh-TW"
                >繁體中文</label
              >
            </span>
          </div>
          <label class="row">
            <span class="text">
              <span class="title" data-i18n="options.useMonaco"></span>
              <span class="desc" data-i18n="options.useMonacoDesc"></span>
            </span>
            <input type="checkbox" class="switch" id="useMonaco" />
          </label>
          <div class="row">
            <span class="text">
              <span class="title" data-i18n="options.theme"></span>
              <span class="desc" data-i18n="options.themeDesc"></span>
            </span>
            <span class="segmented" role="radiogroup" data-i18n-aria-label="options.theme">
              <input type="radio" name="theme" id="theme-light" value="light" /><label
                for="theme-light"
                data-i18n="options.themeLight"
              ></label>
              <input type="radio" name="theme" id="theme-dark" value="dark" /><label
                for="theme-dark"
                data-i18n="options.themeDark"
              ></label>
            </span>
          </div>
          <label class="row">
            <span class="text">
              <span class="title" data-i18n="options.minimap"></span>
              <span class="desc" data-i18n="options.minimapDesc"></span>
            </span>
            <input type="checkbox" class="switch" id="minimap" />
          </label>
          <div class="row stacked">
            <span class="text">
              <span class="title" data-i18n="options.fontFamily"></span>
              <span class="desc" data-i18n="options.fontFamilyDesc"
                ><code data-i18n-slot="example">"JetBrains Mono", Consolas</code></span
              >
            </span>
            <input
              type="text"
              id="fontFamily"
              spellcheck="false"
              data-i18n-placeholder="options.fontFamilyPlaceholder"
              data-i18n-aria-label="options.fontFamily"
            />
          </div>
        </section>

        <h2 data-i18n="options.toolbar"></h2>
        <section class="card">
          <label class="row">
            <span class="text">
              <span class="title" data-i18n="options.clangdBadge"></span>
              <span class="desc" data-i18n="options.clangdBadgeDesc"></span>
            </span>
            <input type="checkbox" class="switch" id="showClangdBadge" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title" data-i18n="options.slmBadge"></span>
              <span class="desc" data-i18n="options.slmBadgeDesc"></span>
            </span>
            <input type="checkbox" class="switch" id="showSlmBadge" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title" data-i18n="options.formatButton"></span>
              <span class="desc" data-i18n="options.formatButtonDesc"></span>
            </span>
            <input type="checkbox" class="switch" id="showFormatButton" />
          </label>
        </section>

        <h2 data-i18n="options.features"></h2>
        <p class="section-hint" data-i18n="options.featuresHint"></p>
        <section class="card features" id="features"></section>

        <h2 data-i18n="options.slm"></h2>
        <section class="card">
          <div id="slmToggle"></div>
          <div class="row">
            <span class="text">
              <span class="title" data-i18n="options.slmContext"></span>
              <span class="desc" data-i18n="options.slmContextDesc"></span>
            </span>
            <span id="slmContext" class="segmented" role="radiogroup" data-i18n-aria-label="options.slmContext"></span>
          </div>
          <div class="row stacked">
            <span class="text">
              <span class="title" data-i18n="options.slmModel"></span>
              <span class="desc" data-i18n="options.slmModelDesc"></span>
            </span>
            <div id="slmModel" class="models" role="radiogroup" data-i18n-aria-label="options.slmModel"></div>
          </div>
          <p class="note">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M4 7V5a4 4 0 1 1 8 0v2h.5A1.5 1.5 0 0 1 14 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-5A1.5 1.5 0 0 1 3.5 7H4Zm1.5 0h5V5a2.5 2.5 0 0 0-5 0v2Z"
              />
            </svg>
            <span data-i18n="options.slmNote"></span>
          </p>
        </section>

        <h2 data-i18n="options.compileFlags"></h2>
        <section class="card">
          <div class="row stacked">
            <span class="text">
              <span class="title" data-i18n="options.clangdFlags"></span>
              <span class="desc" data-i18n="options.clangdFlagsDesc"></span>
            </span>
            <textarea
              id="compileFlags"
              rows="5"
              spellcheck="false"
              data-i18n-aria-label="options.clangdFlags"
            ></textarea>
            <button type="button" id="resetFlags" class="ghost" data-i18n="options.resetFlags"></button>
          </div>
        </section>
      </form>
    </main>
    <div id="status" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
